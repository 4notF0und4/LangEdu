name: langedu

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: langedu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm.cmd run db:configure first}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Run npm.cmd run db:configure first}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init-app.sh:/docker-entrypoint-initdb.d/init-app.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d langedu"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  postgres_data:
